name: Semantic Versioning and Release

# On every push to main: work out the next version from the conventional commits since the last
# tag, check, build a tarball per architecture, tag, publish a GitHub release, commit the new
# pkgver back, and (when the AUR key secret is set) update the AUR package.
on:
  push:
    branches: [main]

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if this is a version bump commit
        id: check
        env:
          # Passed via env, never interpolated into the script: a commit message can hold quotes,
          # backticks or `$(...)`.
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -q "^chore: bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  version:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      old_version: ${{ steps.bump.outputs.old_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          OLD_VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          if [ "$LAST_TAG" = "v0.0.0" ]; then
            SUBJECTS=$(git log HEAD --pretty=%s)
            BODIES=$(git log HEAD --pretty=%B)
          else
            SUBJECTS=$(git log ${LAST_TAG}..HEAD --pretty=%s)
            BODIES=$(git log ${LAST_TAG}..HEAD --pretty=%B)
          fi

          # Conventional commits, with or without a scope: feat: and feat(practice): both count.
          # `!` after the type, or a BREAKING CHANGE: line in a body, is a major bump.
          if echo "$SUBJECTS" | grep -Eq "^[a-z]+(\([^)]*\))?!:" || echo "$BODIES" | grep -q "^BREAKING CHANGE:"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$SUBJECTS" | grep -Eq "^feat(\([^)]*\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            # fix, chore, docs and anything else that ships: a patch bump
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping $OLD_VERSION -> $NEW_VERSION"

  check:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    uses: ./.github/workflows/check.yml

  build:
    needs: [version, check]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build binary
        run: TYPELADDER_VERSION=${{ needs.version.outputs.new_version }} cargo build --release --locked
      - name: Create tarball
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          NAME=typeladder-${VERSION}-${{ matrix.arch }}
          mkdir -p ${NAME}
          mv target/release/typeladder ${NAME}/
          cp README.md LICENSE NOTICE docs/config.md ${NAME}/
          tar -czf ${NAME}.tar.gz -C ${NAME} .
          sha256sum ${NAME}.tar.gz > ${NAME}.sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.arch }}
          path: |
            typeladder-*.tar.gz
            typeladder-*.sha256

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Update PKGBUILD versions
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD aur/PKGBUILD
      - name: Commit version bump and tag
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add PKGBUILD aur/PKGBUILD
          git commit -m "chore: bump version to v${VERSION}" || echo "No changes to commit"
          git tag "v${VERSION}" -f
          git push origin main
          git push origin "v${VERSION}" -f
      - name: Create GitHub release
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          PREV=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)
          {
            echo "![typeladder's results screen](https://raw.githubusercontent.com/noahlyk/typeladder/v${VERSION}/docs/images/results.png)"
            echo
            echo "**Install:** \`yay -S typeladder\` (AUR), or download the tarball for your architecture below. [Website](https://noahlyk.github.io/typeladder/)"
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${PREV:+$PREV..}"v${VERSION}" | grep -v '^- chore: bump version' || true
          } > release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            dist/typeladder-${VERSION}-*.tar.gz \
            dist/typeladder-${VERSION}-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur:
    needs: [version, release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Push to AUR
        run: |
          # The AUR_SSH_KEY secret is the private key of an account with push rights to the AUR
          # package. Without it this job does nothing.
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY is not set: skipping the AUR update"
            exit 0
          fi
          VERSION=${{ needs.version.outputs.new_version }}
          pacman -Syu --noconfirm openssh git sudo base-devel pacman-contrib

          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          mkdir -p /home/builduser/.ssh
          echo "$AUR_SSH_KEY" > /home/builduser/.ssh/aur
          chmod 600 /home/builduser/.ssh/aur
          chmod 700 /home/builduser/.ssh
          chown -R builduser:builduser /home/builduser/.ssh
          ssh-keyscan aur.archlinux.org >> /home/builduser/.ssh/known_hosts

          # the aur/ folder as of the tag, with the new pkgver
          cp -r aur /home/builduser/aur
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /home/builduser/aur/PKGBUILD
          chown -R builduser:builduser /home/builduser/aur

          # real checksums of the release files and of LICENSE and NOTICE at the tag, then a check
          # that every source downloads and matches them
          sudo -u builduser bash -c 'cd /home/builduser/aur && updpkgsums && makepkg --verifysource --noconfirm'
          # updpkgsums fills only this machine's architecture: aarch64 comes from the release's own .sha256
          SUM=$(curl -fsSL "https://github.com/noahlyk/typeladder/releases/download/v${VERSION}/typeladder-${VERSION}-aarch64.sha256" | cut -d' ' -f1)
          [ ${#SUM} -eq 64 ] || { echo "no aarch64 checksum in the release"; exit 1; }
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$SUM')/" /home/builduser/aur/PKGBUILD
          if grep -q "'SKIP'" /home/builduser/aur/PKGBUILD; then
            echo "a checksum is still SKIP: not pushing"
            exit 1
          fi

          sudo -u builduser VERSION="$VERSION" GIT_SSH_COMMAND="ssh -i /home/builduser/.ssh/aur -o StrictHostKeyChecking=no" bash -c '
            cd /home/builduser
            git clone ssh://aur@aur.archlinux.org/typeladder.git aur-push 2>&1 || true
            if [ -d "aur-push/.git" ]; then
              cd aur-push
              git fetch origin
              git reset --hard origin/master
              cd ..
            else
              mkdir -p aur-push
              cd aur-push
              git init
              git remote add origin ssh://aur@aur.archlinux.org/typeladder.git
              cd ..
            fi

            rm -rf aur-push/*
            cp aur/PKGBUILD aur/typeladder.install aur-push/

            cd aur-push
            makepkg --printsrcinfo > .SRCINFO
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git add PKGBUILD .SRCINFO typeladder.install
            git commit -m "Update to v${VERSION}" || echo "No changes to commit"
            git push origin master
          '
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
