[package]
name = "typeladder"
version = "0.1.0"
description = "An adaptive typing test that builds your vocabulary from the commonest word to the rarest"
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/noahlyk/typeladder"
build = "build.rs"

[[bin]]
name = "typeladder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
serde_norway = "0.9"
ureq = "2"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ctrlc = { version = "3", features = ["termination"] }

# The bar is `cargo clippy --release --all-targets -- -D warnings`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unreadable_literal = "allow"
struct_excessive_bools = "allow"
